# Bundled `careful` pipeline (Product Spec §30.2; Q031).
# Review gates are fresh, structured, evidence-backed reports. Design and code
# repairs resume their owning sessions. Deterministic verification precedes the
# final fresh verifier and publication.
schemaVersion: 1
id: careful
name: Careful
description: >
  Design critique and plan validation, implementation, fresh code review,
  bounded repair, deterministic checks, final verification, then publish.
mode: autonomous

limits:
  max_repair_attempts: 2

stages:
  - id: understand-design
    type: agent
    profile: designer
    reads: [task.current]
    writes: [artifacts.design]
    completion:
      require:
        - valid_result_envelope
        - artifact: design

  - id: critique
    type: agent
    profile: critic
    needs: [understand-design]
    session:
      policy: fresh
    reads: [task.current, artifacts.design]
    writes: [artifacts.design_critique, decisions.review_design]
    completion:
      require:
        - valid_result_envelope
        - artifact: design_critique
        - schema_check: review-report-v1

  - id: revise-plan
    type: agent
    profile: designer
    needs: [critique]
    session:
      policy: resume
    reads: [task.current, artifacts.design, artifacts.design_critique]
    writes: [artifacts.plan_revision, decisions.repair_design]
    completion:
      require:
        - valid_result_envelope
        - artifact: plan_revision
        - schema_check: repair-report-v1

  - id: plan-review
    type: agent
    profile: plan-reviewer
    session:
      policy: fresh
    reads: [artifacts.design_critique, artifacts.plan_revision]
    writes: [artifacts.plan_validation, decisions.review_plan]
    completion:
      require:
        - valid_result_envelope
        - artifact: plan_validation
        - schema_check: review-report-v1
        - verdict: plan-reviewer

  - id: build
    type: agent
    profile: builder
    needs: [revise-plan, plan-review]
    session:
      policy: fresh
    reads: [task.current, artifacts.plan_revision, artifacts.plan_validation]
    writes: [artifacts.implementation]
    completion:
      require:
        - valid_result_envelope
        - non_empty_diff

  - id: code-review
    type: agent
    profile: code-reviewer
    needs: [build]
    session:
      policy: fresh
    reads: [artifacts.implementation]
    writes: [artifacts.code_review, decisions.review_code]
    completion:
      require:
        - valid_result_envelope
        - artifact: code_review
        - schema_check: review-report-v1

  - id: repair
    type: agent
    profile: builder
    session:
      policy: resume
    reads: [artifacts.implementation, artifacts.code_review]
    writes: [artifacts.repair, decisions.repair_code]
    completion:
      require:
        - valid_result_envelope
        - artifact: repair
        - schema_check: repair-report-v1
        - non_empty_diff
    on_validation_failure:
      strategy: repair
      session: resume
      max_attempts: 2

  - id: verify
    type: verify
    profile: verifier
    needs: [code-review, repair]
    reads: [artifacts.implementation, artifacts.repair]
    writes: [artifacts.verification]

  - id: final-verification
    type: agent
    profile: verifier
    needs: [verify]
    session:
      policy: fresh
    reads: [artifacts.code_review, artifacts.repair, artifacts.verification]
    writes: [artifacts.final_verification, decisions.review_final]
    completion:
      require:
        - valid_result_envelope
        - artifact: final_verification
        - schema_check: final-verification-report-v1
        - verdict: verifier

  - id: publish
    type: publish
    needs: [final-verification]
    reads: [artifacts.implementation, artifacts.verification, artifacts.final_verification]
    writes: [artifacts.publication]

edges:
  - from: revise-plan
    to: plan-review
    when:
      expression: risk.requiresPlanReview == true
  - from: code-review
    to: repair
    when:
      expression: decisions.review_code.actionableFindingIds.length > 0
