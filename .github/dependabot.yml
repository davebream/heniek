version: 2

updates:
  # Version updates are handled by Renovate, which supports the repository's
  # pnpm 11 catalogs. Keeping this ecosystem entry lets Dependabot continue to
  # open immediate security updates while the zero limit suppresses routine
  # version-update pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Security fixes for workflow actions remain immediate. Renovate owns all
  # routine version updates, including updates to SHA-pinned actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
